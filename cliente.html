<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Fiche cliente — Espace Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=e14">
</head>
<body>
<header class="topbar">
  <a class="brand" href="coach.html">← Mes clientes</a>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button class="btn-ghost btn-sm" id="logout">Déconnexion</button>
</header>

<main class="wrap wrap-narrow" id="main">
  <div class="loader"><div class="spin"></div></div>
</main>

<input type="file" id="photoInput" accept="image/*" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=e14"></script>
<script src="js/supabaseClient.js?v=e14"></script>
<script src="js/auth.js?v=e14"></script>
<script src="js/db.js?v=e14"></script>
<script src="js/calc.js?v=e14"></script>
<script src="js/ui/modal.js?v=e14"></script>
<script src="js/ui/progress.js?v=e14"></script>
<script>
const CID = new URLSearchParams(location.search).get("id");
let D = null;             // dossier courant
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16); }));
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
// Génère un code d'accès lisible : PRÉNOM-XXXXX (sans I,O,0,1 pour éviter les confusions).
function makeCode(prenom){
  const base = (prenom||"CLI").normalize("NFD").replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,6) || "CLI";
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = ""; for (let i=0;i<5;i++) s += A[Math.floor(Math.random()*A.length)];
  return base + "-" + s;
}

// ============================ CHARGEMENT / RENDU ============================
async function reload(){ D = await DB.dossier(CID); render(); }

function render(){
  if (!D || !D.cliente){ document.getElementById("main").innerHTML =
    `<div class="card"><p class="empty">Cliente introuvable.</p></div>`; return; }
  const cl = D.cliente, ac = D.accompagnement;
  const s = Calc.seancesStats(ac, D.seances);
  const b = Calc.bilanStats(D.bilans);
  const suivi = Calc.suiviStats(ac);
  const sport = lastProg("sportif"), nutri = lastProg("nutrition");
  const pay = Calc.paiementsStats(D.paiements, ac);
  const age = Calc.age(cl.date_naissance);

  document.getElementById("main").innerHTML = `
    <div class="row between" style="margin-bottom:14px">
      <div>
        <h1 class="page-title">${esc(cl.prenom)} <em>${esc(cl.nom||"")}</em></h1>
        <div class="cl-meta">
          <span class="badge badge-type">${Calc.labelType(cl.type)}</span>
          <span class="st st-${cl.statut}">${Calc.labelStatut(cl.statut)}</span>
          ${cl.profile_id?`<span class="tag">🔑 ${esc(cl.access_code)}</span>`:''}
        </div>
      </div>
      <div class="row" style="gap:8px">
        <button class="btn-ghost btn-sm" data-act="toggle-select">☑️ Sélection</button>
        <button class="btn-ghost btn-sm" data-act="edit-cliente">Modifier</button>
        <button class="btn-ghost btn-sm" data-act="del-cliente" style="color:var(--danger);border-color:rgba(192,86,75,.4)">Supprimer</button>
      </div>
    </div>

    <!-- RÉSUMÉ -->
    <div class="card card-dark">
      <div class="summary">
        <div class="sum-item"><div class="k">Objectif</div><div class="v">${esc(cl.objectif_principal||"—")}</div></div>
        <div class="sum-item"><div class="k">Début</div><div class="v">${Calc.fmt(ac&&ac.date_debut)}</div></div>
        <div class="sum-item"><div class="k">Fin</div><div class="v">${Calc.fmt(ac&&ac.date_fin)}<small>${ac&&ac.nb_mois?ac.nb_mois+" mois":""}</small></div></div>
        <div class="sum-item"><div class="k">Séances</div><div class="v">${s.realisees} / ${s.prevues}<small>${s.restantes} restantes</small></div></div>
        <div class="sum-item"><div class="k">Dernier bilan</div><div class="v">${Calc.fmt(b.dernier)}</div></div>
        <div class="sum-item"><div class="k">Prochain bilan</div><div class="v">${Calc.fmt(b.prochain)}<small>${b.joursAvant!=null?(b.joursAvant<0?Math.abs(b.joursAvant)+" j de retard":"dans "+b.joursAvant+" j"):""}</small></div></div>
        <div class="sum-item"><div class="k">Programme sportif</div><div class="v">${sport&&sport.envoye?"Envoyé":"—"}<small>${sport&&sport.envoye?Calc.fmt(sport.date_envoi):""}</small></div></div>
        <div class="sum-item"><div class="k">Nutrition</div><div class="v">${ac&&ac.nutrition_active?"Oui":"Non"}<small>${nutri&&nutri.envoye?"Prog. "+Calc.fmt(nutri.date_envoi):""}</small></div></div>
        ${age!=null?`<div class="sum-item"><div class="k">Âge</div><div class="v">${age} ans</div></div>`:''}
        <div class="sum-item"><div class="k">Encaissé</div><div class="v">${Calc.euro(pay.total)}<small>${pay.prix!=null?"forfait "+Calc.euro(pay.prix)+(pay.reste>0?" · reste "+Calc.euro(pay.reste):(pay.reste<0?"":" · soldé")):""}</small></div></div>
      </div>
      ${s.prevues?`<div style="margin-top:16px">${UI.progressBar(s.pct, s.realisees+" / "+s.prevues+" séances réalisées")}</div>`:''}
    </div>

    <!-- ACTIONS RAPIDES -->
    <div class="quick">
      <button class="qbtn qbtn-accent" data-act="add-seance"><span class="i">🏋️</span> Séance</button>
      <button class="qbtn" data-act="add-bilan"><span class="i">📋</span> Bilan</button>
      <button class="qbtn" data-act="add-mensu"><span class="i">📏</span> Mensurations</button>
      <button class="qbtn" data-act="add-photo"><span class="i">📸</span> Photo</button>
      <button class="qbtn" data-act="add-objectif"><span class="i">🎯</span> Objectif</button>
      <button class="qbtn" data-act="add-paiement"><span class="i">💶</span> Paiement</button>
      <button class="qbtn" data-act="add-note"><span class="i">🔒</span> Note privée</button>
      <button class="qbtn" data-act="prog-sportif"><span class="i">📤</span> Prog. sportif envoyé</button>
      <button class="qbtn" data-act="prog-nutrition"><span class="i">🥗</span> Prog. nutrition envoyé</button>
    </div>

    ${sectionAccesCliente()}
    ${sectionCoordonnees()}
    ${sectionAccompagnement(ac, s, suivi)}
    ${sectionPaiements()}
    ${sectionSeances()}
    ${sectionProgrammes()}
    ${sectionBilans()}
    ${sectionMensurations()}
    ${sectionPhotos()}
    ${sectionObjectifs()}
    ${sectionTimeline()}
    ${sectionNotes()}
  `;
  loadPhotoThumbs();
}

function lastProg(kind){ return (D.programmes||[]).filter(p=>p.kind===kind).sort((a,b)=>a.created_at<b.created_at?1:-1)[0]||null; }

// ============================ SECTIONS ============================
function block(title, count, body, open){
  return `<details class="section-block" ${open?"open":""}>
    <summary><span class="chev">▸</span>${title}${count!=null?`<span class="count">${count}</span>`:""}</summary>
    <div class="section-body">${body}</div></details>`;
}
// Case à cocher de sélection multiple (masquée hors mode « Sélection »).
function selBox(entity,id,path){
  return `<input type="checkbox" class="selchk" data-entity="${entity}" data-id="${id}"${path?` data-path="${esc(path)}"`:""} title="Sélectionner" onclick="event.stopPropagation()">`;
}
function delEdit(entity,id){
  return `<div class="iact">
    ${selBox(entity,id)}
    <button class="icon-btn" data-act="edit-${entity}" data-id="${id}">✎</button>
    <button class="icon-btn" data-act="del" data-entity="${entity}" data-id="${id}">🗑</button></div>`;
}

function sectionAccompagnement(ac,s,suivi){
  const body = `
    <div class="cl-line"><span>Formule</span><strong>${esc((ac&&ac.formule)||"—")}</strong></div>
    <div class="cl-line"><span>Fréquence prévue</span><strong>${esc((ac&&ac.freq_prevue)||"—")}</strong></div>
    <div class="cl-line"><span>Séances prévues</span><strong>${s.prevues}</strong></div>
    <div class="cl-line"><span>Réalisées / restantes</span><strong>${s.realisees} / ${s.restantes}</strong></div>
    ${suivi.pctTemps!=null?`<div style="margin-top:10px">${UI.progressBar(suivi.pctTemps,"Temps de suivi écoulé")}</div>`:""}
    <div class="cl-line" style="margin-top:8px"><span>Objectifs secondaires</span><strong>${esc((D.cliente.objectifs_secondaires)||"—")}</strong></div>
    ${ac&&ac.nutrition_active?`<div class="mensu-card" style="margin-top:10px">
      <h4 style="font-size:.95rem">🥗 Nutrition <span class="tag">visible cliente</span></h4>
      ${(ac.nut_calories!=null||ac.nut_proteines!=null||ac.nut_glucides!=null||ac.nut_lipides!=null)?`<div class="cl-line" style="margin-top:6px"><span>Objectifs / jour</span><strong>${[ac.nut_calories!=null?ac.nut_calories+" kcal":null,ac.nut_proteines!=null?"P "+ac.nut_proteines+"g":null,ac.nut_glucides!=null?"G "+ac.nut_glucides+"g":null,ac.nut_lipides!=null?"L "+ac.nut_lipides+"g":null].filter(Boolean).join(" · ")}</strong></div>`:`<div class="isub">Aucun objectif calorique/macros saisi.</div>`}
      ${ac.nut_conseils?`<div class="isub" style="margin-top:6px;white-space:pre-wrap">${esc(ac.nut_conseils)}</div>`:""}
    </div>`:""}
    <div style="margin-top:12px"><button class="link" data-act="edit-accomp">Modifier l'accompagnement</button></div>`;
  return block("Accompagnement", null, body, false);
}

function sectionAccesCliente(){
  const cl = D.cliente;
  const has = !!cl.profile_id;
  const code = cl.access_code || "";
  const body = has ? `
    <p class="isub" style="margin-bottom:10px">La cliente consulte son suivi en <strong>lecture seule</strong> sur la page de connexion cliente. Le code sert d'identifiant <em>et</em> de mot de passe.</p>
    <div class="code-box">
      <span class="code-val" id="codeVal">${esc(code)}</span>
      <button class="btn-ghost btn-sm" data-act="copy-code">Copier</button>
    </div>
    <div class="row" style="gap:14px;margin-top:12px">
      <a class="link" href="espace.html" target="_blank" rel="noopener">Ouvrir l'espace cliente ↗</a>
      <button class="link" data-act="regen-access" style="color:var(--danger)">Régénérer le code</button>
    </div>`
  : `
    <p class="isub" style="margin-bottom:12px">Aucun accès cliente pour l'instant. Génère un code : ${esc(cl.prenom)} pourra consulter son objectif, ses séances, mensurations, bilans, photos et programmes — sans jamais voir tes notes privées ni les paiements.</p>
    <button class="btn-accent btn-sm" data-act="create-access">🔑 Créer l'accès cliente</button>`;
  return block("Accès cliente", null, body, !has);
}

function sectionCoordonnees(){
  const cl = D.cliente;
  const age = Calc.age(cl.date_naissance);
  const poids = Calc.dernierPoids(D.bilans, D.mensurations);
  const imc = Calc.imc(poids, cl.taille_cm);
  const line = (k,v) => v ? `<div class="cl-line"><span>${k}</span><strong>${esc(v)}</strong></div>` : "";
  const body = `
    ${line("Téléphone", cl.telephone)}
    ${line("Email", cl.email_perso)}
    ${cl.date_naissance?`<div class="cl-line"><span>Naissance</span><strong>${Calc.fmt(cl.date_naissance)}${age!=null?` (${age} ans)`:""}</strong></div>`:""}
    ${cl.taille_cm?`<div class="cl-line"><span>Taille</span><strong>${esc(cl.taille_cm)} cm${imc!=null?` · IMC ${imc}`:""}</strong></div>`:""}
    ${line("Niveau", cl.niveau)}
    ${line("Disponibilités", cl.disponibilites)}
    ${cl.sante?`<div class="mensu-card" style="margin-top:10px;border-color:rgba(192,86,75,.35)"><h4 style="color:var(--danger)">⚠️ Santé / antécédents</h4><div class="isub">${esc(cl.sante)}</div></div>`:""}
    ${cl.allergies?`<div class="cl-line" style="margin-top:8px"><span>Allergies</span><strong>${esc(cl.allergies)}</strong></div>`:""}
    ${(!cl.telephone&&!cl.email_perso&&!cl.date_naissance&&!cl.taille_cm&&!cl.niveau&&!cl.disponibilites&&!cl.sante&&!cl.allergies)?`<p class="empty">Aucune coordonnée renseignée.</p>`:""}
    <div style="margin-top:12px"><button class="link" data-act="edit-cliente">Modifier les coordonnées & la santé</button></div>`;
  return block("Coordonnées & santé", null, body, false);
}

function sectionPaiements(){
  const list = D.paiements || [];
  const pay = Calc.paiementsStats(list, D.accompagnement);
  const head = `<div class="mensu-card" style="margin-bottom:10px">
      <div class="cl-line"><span>Total encaissé</span><strong style="color:var(--ok)">${Calc.euro(pay.total)}</strong></div>
      ${pay.prix!=null?`<div class="cl-line"><span>Forfait</span><strong>${Calc.euro(pay.prix)}</strong></div>
      <div class="cl-line"><span>Reste à régler</span><strong style="color:${pay.reste>0?'var(--danger)':'var(--ok)'}">${pay.reste>0?Calc.euro(pay.reste):"Soldé ✓"}</strong></div>`:""}
    </div>`;
  const body = `<p class="isub" style="color:var(--text-light);margin-bottom:8px">🔒 Visible uniquement par toi.</p>` + head +
    (list.length ? list.map(p=>`
      <div class="item"><div class="idate">${Calc.fmtShort(p.date)}</div>
        <div class="ibody"><div class="ititle">${Calc.euro(p.montant)} ${p.mode?`<span class="tag">${esc(p.mode)}</span>`:""}</div>
          ${p.note?`<div class="isub">${esc(p.note)}</div>`:""}
        </div>${delEdit("paiement",p.id)}</div>`).join("") : `<p class="empty">Aucun paiement enregistré.</p>`) +
    `<div style="margin-top:10px"><button class="link" data-act="add-paiement">＋ Ajouter un paiement</button></div>`;
  return block("Paiements", list.length, body, false);
}

function sectionSeances(){
  const list = D.seances||[];
  const body = list.length ? list.map(x=>`
    <div class="item">
      <div class="idate">${Calc.fmtShort(x.date)}</div>
      <div class="ibody">
        <div class="ititle">${esc(x.type||"Séance")} ${x.statut!=="realisee"?`<span class="tag">${x.statut}</span>`:""}</div>
        <div class="isub">${[x.objectif&&esc(x.objectif),x.intensite&&("Intensité "+esc(x.intensite)),x.duree&&(x.duree+" min")].filter(Boolean).join(" · ")||"&nbsp;"}</div>
        ${x.commentaire?`<div class="isub">${esc(x.commentaire)}</div>`:""}
        ${Array.isArray(x.exercices)&&x.exercices.length?`<div class="isub">${x.exercices.map(e=>esc(e.nom||e)).join(" • ")}</div>`:""}
      </div>${delEdit("seance",x.id)}
    </div>`).join("") : `<p class="empty">Aucune séance enregistrée.</p>`;
  return block("Séances", list.length, body, false);
}

function sectionProgrammes(){
  const rows = kind => (D.programmes||[]).filter(p=>p.kind===kind).sort((a,b)=>a.created_at<b.created_at?1:-1);
  const render = (label,kind) => {
    const list = rows(kind);
    return `<h4 style="margin:6px 0 4px">${label}</h4>` + (list.length? list.map(p=>`
      <div class="item"><div class="idate">${Calc.fmtShort(p.date_envoi)}</div>
        <div class="ibody"><div class="ititle">${p.envoye?"Envoyé":"Non envoyé"} ${p.version?`<span class="tag">v${esc(p.version)}</span>`:""}</div>
          <div class="isub">${[p.date_debut&&("du "+Calc.fmt(p.date_debut)),p.date_fin&&("au "+Calc.fmt(p.date_fin))].filter(Boolean).join(" ")||"&nbsp;"}</div>
          ${p.commentaire?`<div class="isub">${esc(p.commentaire)}</div>`:""}
        </div>${delEdit("programme",p.id)}</div>`).join("") : `<p class="empty">Aucun programme ${kind}.</p>`);
  };
  return block("Programmes", null, render("Sportif","sportif")+render("Nutrition","nutrition"), false);
}

function sectionBilans(){
  const list = D.bilans||[];
  const body = list.length ? list.map(x=>`
    <div class="item"><div class="idate">${Calc.fmtShort(x.date)}</div>
      <div class="ibody">
        <div class="ititle">Bilan ${x.semaine!=null?"semaine "+x.semaine:""} ${x.poids?`<span class="tag">${x.poids} kg</span>`:""}</div>
        <div class="isub">${[x.ressenti&&("Ressenti : "+esc(x.ressenti)),x.evolution&&esc(x.evolution)].filter(Boolean).join(" · ")||"&nbsp;"}</div>
        ${x.difficultes?`<div class="isub">⚠️ ${esc(x.difficultes)}</div>`:""}
        ${x.points_positifs?`<div class="isub">✅ ${esc(x.points_positifs)}</div>`:""}
        ${x.commentaire_coach?`<div class="isub">💬 ${esc(x.commentaire_coach)}</div>`:""}
      </div>${delEdit("bilan",x.id)}</div>`).join("") : `<p class="empty">Aucun bilan.</p>`;
  return block("Bilans", list.length, body, false);
}

function sectionMensurations(){
  const types = Calc.mensuTypes(D.mensurations);
  const body = types.length ? `<div class="mensu-grid">` + types.map(t=>{
    const ev = Calc.mensuEvolution(D.mensurations, t);
    const dir = ev.diff<0?"down":(ev.diff>0?"up":"");
    const sign = ev.diff>0?"+":"";
    return `<div class="mensu-card">
      <h4>${esc(t.replace(/_/g," "))}</h4>
      <div class="mensu-delta ${dir}">${sign}${ev.diff} ${esc(ev.unite)} ${ev.pct!=null?`(${sign}${ev.pct}%)`:""}</div>
      <div class="isub">${ev.depart}${esc(ev.unite)} → ${ev.derniere}${esc(ev.unite)}</div>
      ${UI.lineChart(ev.points, {unite:ev.unite})}
    </div>`;
  }).join("") + `</div>` : `<p class="empty">Aucune mensuration.</p>`;
  // Liste regroupée PAR DATE (un relevé = une date), toutes les dates affichées,
  // de la plus récente à la plus ancienne → aucun relevé n'est caché.
  const byDate = {};
  (D.mensurations||[]).forEach(m=>{ (byDate[m.date] ||= []).push(m); });
  const dates = Object.keys(byDate).sort((a,b)=> a<b?1:-1);
  const listing = dates.length ? `<div style="margin-top:14px">` + dates.map(d=>`
    <div class="card" style="margin-top:8px;padding:10px 12px">
      <div class="idate" style="font-weight:700;margin-bottom:6px">${Calc.fmtShort(d)}</div>
      ${byDate[d].map(m=>`<div class="cl-line" style="padding:3px 0">
          <span>${esc(m.type.replace(/_/g," "))}</span>
          <span style="display:flex;align-items:center;gap:8px"><strong>${m.valeur}${esc(m.unite||"")}</strong>
            ${selBox("mensuration",m.id)}
            <button class="icon-btn" data-act="del" data-entity="mensuration" data-id="${m.id}">🗑</button>
          </span></div>`).join("")}
    </div>`).join("") + `</div>` : "";
  return block("Mensurations & évolution", (D.mensurations||[]).length, body+listing, false);
}

function sectionPhotos(){
  const list = D.photos||[];
  const body = list.length ? `<div class="mensu-grid" id="photoGrid">` + list.map(p=>`
    <div class="mensu-card">
      <div class="cl-line"><strong>${Calc.fmt(p.date)}</strong>
        <span class="tag">${p.visibilite==="cliente"?"👁 Visible cliente":"🔒 Privé"}</span></div>
      <div class="photo-thumb" data-path="${esc(p.storage_path)}" style="margin:8px 0;border-radius:12px;overflow:hidden;background:var(--cream);min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--text-light);font-size:.8rem">chargement…</div>
      ${p.legende?`<div class="isub">${esc(p.legende)}</div>`:""}
      <div style="margin-top:6px">${selBox("photo",p.id,p.storage_path)} <button class="link" data-act="toggle-photo" data-id="${p.id}" data-vis="${p.visibilite}">${p.visibilite==="cliente"?"Rendre privé":"Rendre visible"}</button>
      &nbsp;·&nbsp;<button class="link" data-act="del" data-entity="photo" data-id="${p.id}" data-path="${esc(p.storage_path)}">Supprimer</button></div>
    </div>`).join("") + `</div>` : `<p class="empty">Aucune photo.</p>`;
  return block("Photos de progression", list.length, body, false);
}

function sectionObjectifs(){
  const list = D.objectifs||[];
  const icon = st => ({en_cours:"⏳",atteint:"✅",abandonne:"⛔"}[st]||"");
  const body = list.length ? list.map(o=>`
    <div class="item"><div class="idate">${icon(o.statut)}</div>
      <div class="ibody"><div class="ititle">${esc(o.titre)}</div>
        ${o.description?`<div class="isub">${esc(o.description)}</div>`:""}
        <div class="isub">${o.statut.replace("_"," ")} · créé le ${Calc.fmt(o.date_creation)}${o.date_atteinte?" · atteint le "+Calc.fmt(o.date_atteinte):""}</div>
      </div>${delEdit("objectif",o.id)}</div>`).join("") : `<p class="empty">Aucun objectif.</p>`;
  return block("Objectifs", list.length, body, false);
}

function sectionTimeline(){
  const ev = [];
  (D.bilans||[]).forEach(x=>ev.push({d:x.date,t:"🟠 Bilan "+(x.semaine!=null?"S"+x.semaine:"")}));
  (D.seances||[]).forEach(x=>ev.push({d:x.date,t:"🏋️ "+(x.type||"Séance")}));
  (D.mensurations||[]).forEach(x=>ev.push({d:x.date,t:"📏 "+x.type.replace(/_/g," ")}));
  (D.photos||[]).forEach(x=>ev.push({d:x.date,t:"📸 Photo"}));
  (D.objectifs||[]).forEach(x=>ev.push({d:x.date_creation,t:"🎯 "+x.titre}));
  (D.programmes||[]).filter(p=>p.envoye).forEach(x=>ev.push({d:x.date_envoi,t:(x.kind==="sportif"?"📤 Programme sportif":"🥗 Programme nutrition")+" envoyé"}));
  (D.paiements||[]).forEach(x=>ev.push({d:x.date,t:"💶 Paiement "+Calc.euro(x.montant)+(x.mode?" ("+x.mode+")":"")}));
  ev.sort((a,b)=>(a.d<b.d?1:-1));
  const body = ev.length ? `<div class="tl">`+ev.slice(0,40).map(e=>`
    <div class="tl-item"><div class="tl-date">${Calc.fmt(e.d)}</div><div class="tl-txt">${esc(e.t)}</div></div>`).join("")+`</div>`
    : `<p class="empty">Rien pour l'instant.</p>`;
  return block("Timeline", null, body, false);
}

async function addMensuSession(){
  const fields = [{ name:"date", label:"Date", type:"date", value:Calc.today() }]
    .concat(MENSU_PRESETS.map(p=>({ name:p.name, label:p.label, type:"number", half:true })));
  const v = await UI.form({ title:"Mensurations", submit:"Enregistrer", fields });
  if (!v) return;
  const rows = MENSU_PRESETS
    .filter(p => v[p.name] != null && v[p.name] !== "")
    .map(p => ({ cliente_id:CID, date:v.date, type:p.name, valeur:Number(v[p.name]), unite:p.unite }));
  // Masse grasse calculée automatiquement (méthode US Navy) si non saisie à la main
  // et si tour de taille + hanches + cou + taille (hauteur) sont disponibles.
  if ((v.masse_grasse==null || v.masse_grasse==="") && D && D.cliente){
    const mg = Calc.masseGrasseNavy(v.tour_taille, v.tour_hanches, v.tour_cou, D.cliente.taille_cm);
    if (mg != null) rows.push({ cliente_id:CID, date:v.date, type:"masse_grasse", valeur:mg, unite:"%" });
  }
  if (!rows.length){ UI.toast("Aucune mesure saisie"); return; }
  try{ await window.sb.from("mensurations").insert(rows);
    const mgRow = rows.find(r=>r.type==="masse_grasse");
    UI.toast(rows.length+" mesure(s) enregistrée(s)"+(mgRow?` · masse grasse ${mgRow.valeur}% calculée ✓`:" ✓")); reload(); }
  catch(e){ console.error(e); UI.toast("Erreur : "+(e.message||e),"err"); }
}

// Bilan COMPLET côté coach : champs bilan + toutes les mensurations (+ masse grasse auto),
// enregistrés ensemble (un bilan = ressenti + mesures), comme côté cliente.
async function addBilanCoach(rec){
  const x = rec || {};
  const fields = bilanFields(x).concat(MENSU_PRESETS.map(p=>({ name:p.name, label:p.label, type:"number", half:true })));
  const v = await UI.form({ title:(rec?"Modifier ":"")+"Bilan", submit:"Enregistrer", fields });
  if (!v) return;
  const BILAN_KEYS = ["date","semaine","poids","ressenti","evolution","objectifs_atteints",
    "difficultes","points_positifs","nouveaux_objectifs","commentaire_coach"];
  const bilanPayload = { cliente_id:CID };
  BILAN_KEYS.forEach(k=>{ if (k in v) bilanPayload[k]=v[k]; });
  const rows = MENSU_PRESETS
    .filter(p => p.name!=="masse_grasse" && v[p.name]!=null && v[p.name]!=="")
    .map(p => ({ cliente_id:CID, date:v.date, type:p.name, valeur:Number(v[p.name]), unite:p.unite }));
  if (v.masse_grasse!=null && v.masse_grasse!=="")
    rows.push({ cliente_id:CID, date:v.date, type:"masse_grasse", valeur:Number(v.masse_grasse), unite:"%" });
  else {
    const mg = Calc.masseGrasseNavy(v.tour_taille, v.tour_hanches, v.tour_cou, D.cliente && D.cliente.taille_cm);
    if (mg!=null) rows.push({ cliente_id:CID, date:v.date, type:"masse_grasse", valeur:mg, unite:"%" });
  }
  try{
    if (rec) await DB.update("bilans", rec.id, bilanPayload);
    else await DB.insert("bilans", bilanPayload);
    if (rows.length) await window.sb.from("mensurations").insert(rows);
    UI.toast("Bilan enregistré ✓"); reload();
  }catch(e){ console.error(e); UI.toast("Erreur : "+(e.message||e),"err"); }
}

async function addOrEdit(entity, rec){
  const cfg = ENT[entity];
  const v = await UI.form({ title:(rec?"Modifier ":"")+cfg.title, fields:cfg.fields(rec) });
  if (!v) return;
  try{
    const payload = cfg.payload(v);
    if (rec) await DB.update(cfg.table, rec.id, payload);
    else await DB.insert(cfg.table, payload);
    UI.toast("Enregistré ✓"); reload();
  }catch(e){ console.error(e); UI.toast("Erreur : "+(e.message||e),"err"); }
}

  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act==="add-seance") return addOrEdit("seance");
  if (act==="add-bilan") return addBilanCoach();
  if (act==="edit-bilan") return addBilanCoach(findRec("bilan", id));
  if (act==="add-mensu") return addMensuSession();
  if (act==="add-objectif") return addOrEdit("objectif");
  if (act==="add-paiement") return addOrEdit("paiement");
  if (act==="add-note") return addOrEdit("note");
  if (act==="add-photo") return addPhoto();
  if (act==="prog-sportif") return progEnvoye("sportif");
  if (act==="prog-nutrition") return progEnvoye("nutrition");
  if (act==="toggle-select") return setSelMode(!SELMODE);
  if (act==="edit-cliente") return editCliente();
  if (act==="edit-accomp") return editAccomp();
  if (act==="create-access") return createAccess();
  if (act==="regen-access") return regenAccess();
  if (act==="copy-code"){
    const code = D.cliente.access_code||"";
    try{ await navigator.clipboard.writeText(code); UI.toast("Code copié ✓"); }
    catch(_){ UI.toast(code); }
    return;
  }
  if (act==="del-cliente"){
    if (!(await UI.confirm("Supprimer définitivement cette cliente et TOUT son dossier ?"))) return;
    try{ await DB.deleteCliente(CID); UI.toast("Cliente supprimée"); location.href="coach.html"; }
    catch(e){ console.error(e); UI.toast("Erreur : "+(e.message||e),"err"); }
    return;
  }
  if (act.startsWith("edit-")){
    const entity = act.slice(5);
    if (ENT[entity]) return addOrEdit(entity, findRec(entity,id));
  }
  if (act==="toggle-photo"){
    const nv = el.dataset.vis==="cliente"?"prive":"cliente";
    await DB.update("photos", id, { visibilite:nv }); UI.toast("Visibilité mise à jour"); return reload();
  }
  if (act==="del"){
    const entity = el.dataset.entity;
    if (!(await UI.confirm("Supprimer cet élément ?"))) return;
    const tbl = {seance:"seances",bilan:"bilans",mensuration:"mensurations",objectif:"objectifs",
                 note:"notes_privees",programme:"programmes",photo:"photos",paiement:"paiements"}[entity];
    // On garde une copie complète AVANT suppression → permet le "retour arrière".
    const backup = entity!=="photo" ? findRec(entity, id) : null;
    try{
      if (entity==="photo" && el.dataset.path) await sb.storage.from("photos").remove([el.dataset.path]);
      await DB.remove(tbl, id);
      reload();
      if (backup) showUndo(tbl, backup); else UI.toast("Supprimé");
    }catch(e2){ console.error(e2); UI.toast("Erreur : "+(e2.message||e2),"err"); }
  }
});

// ============================ SUPPRESSION EN LOT ============================
// Mode « Sélection » : affiche une case à cocher sur chaque élément supprimable, plus une
// barre flottante pour tout supprimer d'un coup (avec retour arrière groupé).
let SELMODE = false;
function setSelMode(on){
  SELMODE = on;
  const main = document.getElementById("main");
  main.classList.toggle("sel-mode", on);
  if (!on) main.querySelectorAll(".selchk:checked").forEach(c => c.checked = false);
  const tgl = document.querySelector('[data-act="toggle-select"]');
  if (tgl) tgl.textContent = on ? "✕ Terminer" : "☑️ Sélection";
  updateSelCount();
}
function updateSelCount(){
  const bar = document.getElementById("selBar"); if (!bar) return;
  const n = document.querySelectorAll("#main .selchk:checked").length;
  bar.querySelector(".cnt").textContent = n;
  bar.querySelector(".del").disabled = (n === 0);
  bar.classList.toggle("show", SELMODE);
}
async function deleteSelection(){
  const checks = [...document.querySelectorAll("#main .selchk:checked")];
  if (!checks.length) return;
  if (!(await UI.confirm(`Supprimer les ${checks.length} élément(s) sélectionné(s) ?`))) return;
  // Sauvegardes pour le retour arrière (les photos n'en ont pas, comme en suppression simple).
  const backups = [];
  checks.forEach(c => {
    const entity = c.dataset.entity;
    if (entity !== "photo"){ const rec = findRec(entity, c.dataset.id); if (rec) backups.push({ tbl:TBL[entity], rec }); }
  });
  try{
    for (const c of checks){
      const entity = c.dataset.entity, id = c.dataset.id;
      if (entity === "photo" && c.dataset.path){ try{ await sb.storage.from("photos").remove([c.dataset.path]); }catch(_){} }
      await DB.remove(TBL[entity], id);
    }
    setSelMode(false);
    await reload();
    if (backups.length) showUndoBatch(backups, checks.length); else UI.toast(`${checks.length} supprimé(s)`);
  }catch(e){ console.error(e); UI.toast("Erreur : "+(e.message||e),"err"); }
}
// Retour arrière groupé : réinsère toutes les lignes sauvegardées (regroupées par table).
function showUndoBatch(items, total){
  document.querySelectorAll(".undo-toast").forEach(n=>n.remove());
  const t = document.createElement("div");
  t.className = "toast ok undo-toast";
  t.innerHTML = `${total} supprimé(s) <button type="button" style="margin-left:14px;background:#fff;color:var(--accent);border:none;border-radius:999px;padding:4px 12px;font-weight:700;cursor:pointer">↩ Annuler</button>`;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  t.querySelector("button").onclick = async ()=>{
    try{
      const byTbl = {}; items.forEach(it => (byTbl[it.tbl] ||= []).push(it.rec));
      for (const tbl in byTbl){ const { error } = await window.sb.from(tbl).insert(byTbl[tbl]); if (error) throw error; }
      t.remove(); UI.toast("Restauré ✓"); reload();
    }catch(e){ console.error(e); UI.toast("Impossible de restaurer : "+(e.message||e),"err"); }
  };
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(),300); }, 10000);
}

// Toast "Annuler" : restaure l'élément supprimé (fenêtre de 8 s). Réinsère la ligne exacte
// (même id) → rien n'est vraiment perdu en cas de clic par erreur.
function showUndo(tbl, rec){
  document.querySelectorAll(".undo-toast").forEach(n=>n.remove());
  const t = document.createElement("div");
  t.className = "toast ok undo-toast";
  t.innerHTML = `Supprimé <button type="button" style="margin-left:14px;background:#fff;color:var(--accent);border:none;border-radius:999px;padding:4px 12px;font-weight:700;cursor:pointer">↩ Annuler</button>`;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  t.querySelector("button").onclick = async ()=>{
    try{ const { error } = await window.sb.from(tbl).insert(rec); if (error) throw error;
      t.remove(); UI.toast("Restauré ✓"); reload(); }
    catch(e){ console.error(e); UI.toast("Impossible de restaurer : "+(e.message||e),"err"); }
  };
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(),300); }, 8000);
}

// ============================ INIT ============================
(async ()=>{
  const p = await Auth.requireCoach(); if (!p) return;
  document.getElementById("who").textContent = p.prenom||"Coach";
  document.getElementById("logout").onclick = ()=>Auth.signOut();
  if (!CID){ location.href="coach.html"; return; }
  // Barre flottante « suppression en lot » (hors #main pour survivre aux re-rendus).
  const bar = document.createElement("div");
  bar.id = "selBar"; bar.className = "sel-bar";
  bar.innerHTML = `<b><span class="cnt">0</span> sélectionné(s)</b>
    <button type="button" class="del" disabled>🗑 Supprimer</button>
    <button type="button" class="cancel">Annuler</button>`;
  document.body.appendChild(bar);
  bar.querySelector(".del").onclick = deleteSelection;
  bar.querySelector(".cancel").onclick = () => setSelMode(false);
  document.getElementById("main").addEventListener("change", (e)=>{
    if (e.target.classList && e.target.classList.contains("selchk")) updateSelCount();
  });
  try{ await reload(); }
  catch(e){ console.error(e); document.getElementById("main").innerHTML =
    `<div class="card"><p class="empty">Erreur de chargement. Vérifie la config Supabase et le SQL.</p></div>`; }
})();
</script>
