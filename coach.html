<script>
let STATE = { clientes: [], byId: {}, filter: null, q: "", sort: "", agendaView: "list" };

const FILTERS = [
  { key: "presentiel",  label: "Présentiel",  test: c => c.cliente.type === "presentiel" },
  { key: "distanciel",  label: "Distanciel",  test: c => c.cliente.type === "distanciel" },
  { key: "hybride",     label: "Hybride",     test: c => c.cliente.type === "hybride" },
  { key: "nutrition",   label: "Suivi nutrition", test: c => c.accompagnement && c.accompagnement.nutrition_active },
  { key: "nutri_renouv", label: "Nutrition à renouveler", test: c => {
      if (!(c.accompagnement && c.accompagnement.nutrition_active)) return false;
      const dernier = (c.programmes||[]).filter(p=>p.kind==="nutrition")
        .sort((a,b)=> (a.date_envoi||a.created_at||"") < (b.date_envoi||b.created_at||"") ? 1 : -1)[0];
      if (!dernier) return true; // nutrition active mais aucun programme encore → à faire
      const ech = dernier.date_fin || Calc.dateFin(dernier.date_envoi || (dernier.created_at?String(dernier.created_at).slice(0,10):null), 1);
      const jr = Calc.daysFromToday(ech);
      return jr !== null && jr <= 7;
    } },
  { key: "bilan_du",    label: "Bilan à venir",   test: c => { const b = Calc.bilanStats(c.bilans, c.accompagnement && c.accompagnement.date_debut); return b.joursAvant !== null && b.joursAvant >= 0 && b.joursAvant <= 7; } },
  { key: "bilan_retard",label: "Bilan en retard", test: c => { const b = Calc.bilanStats(c.bilans, c.accompagnement && c.accompagnement.date_debut); return b.joursAvant !== null && b.joursAvant < 0; } },
  { key: "echeance",    label: "Suivi bientôt fini", test: c => { const s = Calc.suiviStats(c.accompagnement); return s.joursRestants !== null && s.joursRestants >= 0 && s.joursRestants <= 14; } },
  { key: "prog_env",    label: "Programme à envoyer", test: c => {
      if (c.cliente.statut !== "active") return false;
      const besoinSport = c.cliente.type === "distanciel" || c.cliente.type === "hybride";
      const nutritionActive = c.accompagnement && c.accompagnement.nutrition_active;
      const sportEnvoye = (c.programmes||[]).some(p => p.kind==="sportif" && p.envoye);
      const nutEnvoye   = (c.programmes||[]).some(p => p.kind==="nutrition" && p.envoye);
      return (besoinSport && !sportEnvoye) || (nutritionActive && !nutEnvoye);
    } },
  { key: "relancer",    label: "À relancer",  test: c => c.cliente.statut === "a_renouveler" },
];

function initials(c){ return ((c.prenom||"?")[0]||"").toUpperCase(); }
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

// WhatsApp vers une cliente : helpers centralisés dans Calc (waHref / bilanMsg / seanceRappelMsg).

// ---- Agenda : toutes les séances "prévues" à venir, toutes clientes confondues ----
function renderAgenda(){
  const box = document.getElementById("agenda");
  const today = Calc.today();
  const items = [];
  STATE.clientes.forEach(c => (c.seances||[]).forEach(s => {
    // On garde aussi les séances déjà "réalisées" (à partir d'aujourd'hui) pour qu'une séance
    // cochée « faite » NE disparaisse PAS : elle reste visible, marquée ✅.
    if ((s.statut==="prevue"||s.statut==="realisee") && s.date && s.date>=today)
      items.push({ id:s.id, date:s.date, type:s.type, heure:s.heure, statut:s.statut, cl:c.cliente });
  }));
  if (!items.length){
    box.innerHTML = `<details class="section-block" style="margin:14px 0">
      <summary><span class="chev">▸</span>📅 Séances à venir<span class="count">0</span></summary>
      <div class="section-body"><p class="empty">Aucune séance programmée. Depuis une fiche cliente, clique
        « 🏋️ Séance », choisis le statut <strong>Prévue</strong> et une date à venir : elle apparaîtra ici
        et dans l'espace de ta cliente.</p></div></details>`;
    return;
  }
  // Rendu d'UNE séance (ligne).
  const line = (it) => {
    const hh = Calc.fmtHeure(it.heure);
    const nom = `<a href="cliente.html?id=${it.cl.id}" style="text-decoration:none;color:inherit;flex:1 1 100%;min-width:0"><strong>${esc(it.cl.prenom)} ${esc(it.cl.nom||"")}</strong>${hh?` · ${hh}`:""}${it.type?` · ${esc(it.type)}`:""}</a>`;
    if (it.statut==="realisee"){
      return `<div class="cl-line" style="padding:5px 0;opacity:.6">${nom}
        <span class="tag tag-done" style="cursor:default">✅ Fait</span></div>`;
    }
    const wa = Calc.waHref(it.cl.telephone, Calc.seanceRappelMsg(it.cl, it.date, it.type, it.heure));
    return `<div class="cl-line" style="padding:5px 0;flex-wrap:wrap">${nom}
      <span style="display:flex;gap:6px;align-items:center;flex:1 1 100%;flex-wrap:wrap;justify-content:flex-start;margin-top:4px">
        <button class="tag tag-done" data-done="${it.id}" title="Marquer cette séance comme faite">✅ Fait</button>
        <button class="tag" data-ics="${it.id}" data-cl="${it.cl.id}" title="Ajouter à mon agenda Apple (avec rappels)">📅 Agenda</button>
        ${wa?`<a class="tag tag-wa" href="${wa}" target="_blank" rel="noopener">🔔 Rappeler</a>`:""}
        <a class="tag" href="cliente.html?id=${it.cl.id}&editSeance=${it.id}" title="Modifier cette séance">✏️ Modifier</a>
      </span></div>`;
  };
  // Rendu d'une liste de séances GROUPÉES PAR DATE (triées par heure dans chaque jour).
  const groups = (arr) => {
    const byDate = {};
    arr.forEach(it => (byDate[it.date] ||= []).push(it));
    Object.values(byDate).forEach(a => a.sort((x,y)=> (x.heure||"99")<(y.heure||"99")?-1:((x.heure||"99")>(y.heure||"99")?1:0)));
    return Object.keys(byDate).sort((a,b)=> a<b?-1:1).map(d=>`
      <div class="card" style="margin-top:8px;padding:10px 12px">
        <div class="idate" style="font-weight:700;margin-bottom:6px;text-transform:capitalize">${Calc.fmtJour(d)}</div>
        ${byDate[d].map(line).join("")}
      </div>`).join("");
  };
  // P2 — « Aujourd'hui » épinglé et OUVERT (ce que la coach doit faire dans la journée),
  // le reste des séances futures en dessous, replié.
  const todayItems  = items.filter(i => i.date === today);
  const futureItems = items.filter(i => i.date > today);
  const nToday = todayItems.filter(i=>i.statut==="prevue").length;
  const doneToday = todayItems.filter(i=>i.statut==="realisee").length;
  const nFut = futureItems.filter(i=>i.statut==="prevue").length;
  const todayBlock = todayItems.length ? `<details class="section-block" open style="margin:14px 0">
      <summary><span class="chev">▸</span>📅 Aujourd'hui<span class="count" style="background:var(--accent);color:#fff">${nToday}</span>${doneToday?`<span class="count" style="background:var(--ok);color:#fff">✅ ${doneToday}</span>`:""}</summary>
      <div class="section-body">${groups(todayItems)}</div></details>` : "";
  const futureBlock = futureItems.length ? `<details class="section-block" style="margin:14px 0">
      <summary><span class="chev">▸</span>📅 Séances à venir<span class="count">${nFut}</span></summary>
      <div class="section-body">${groups(futureItems)}</div></details>` : "";
  const listContent = todayBlock + futureBlock;

  // P4 — vue SEMAINE : les 7 prochains jours (aujourd'hui → +6), TOUS affichés (même
  // vides) pour voir d'un coup les créneaux libres à remplir.
  const base = Calc.parse(today);
  const wk = []; for (let i=0;i<7;i++){ const d=new Date(base); d.setDate(d.getDate()+i); wk.push(Calc.ymd(d)); }
  const byDate = {};
  items.forEach(it => { if (it.date>=wk[0] && it.date<=wk[6]) (byDate[it.date] ||= []).push(it); });
  Object.values(byDate).forEach(a => a.sort((x,y)=> (x.heure||"99")<(y.heure||"99")?-1:((x.heure||"99")>(y.heure||"99")?1:0)));
  const nWeek = wk.reduce((n,d)=> n + (byDate[d]||[]).filter(i=>i.statut==="prevue").length, 0);
  const weekCards = wk.map(d=>{
    const arr = byDate[d]||[];
    return `<div class="card" style="margin-top:8px;padding:10px 12px${d===today?';border:1px solid var(--accent)':''}">
      <div class="idate" style="font-weight:700;margin-bottom:6px;text-transform:capitalize">${Calc.fmtJour(d)}${d===today?" · aujourd'hui":""}${arr.length?`<span class="count">${arr.length}</span>`:""}</div>
      ${arr.length ? arr.map(line).join("") : `<p class="empty" style="margin:0">— aucune séance —</p>`}
    </div>`;
  }).join("");
  const weekContent = `<details class="section-block" open style="margin:14px 0">
      <summary><span class="chev">▸</span>🗓️ Ma semaine<span class="count" style="background:var(--accent);color:#fff">${nWeek}</span></summary>
      <div class="section-body">${weekCards}</div></details>`;

  // Sélecteur de vue.
  const toggle = `<div class="chips" style="margin:14px 0 0">
      <button class="chip ${STATE.agendaView!=="week"?"on":""}" data-view="list">📅 À venir</button>
      <button class="chip ${STATE.agendaView==="week"?"on":""}" data-view="week">🗓️ Semaine</button>
    </div>`;
  box.innerHTML = toggle + (STATE.agendaView==="week" ? weekContent : listContent);
}

// ---- Suivi des bilans : qui a rempli, quand, et qui doit le faire ----
function renderBilans(){
  const box = document.getElementById("bilansSuivi");
  // On suit les clientes en cours (on n'affiche pas les accompagnements terminés).
  const suivies = STATE.clientes.filter(c => c.cliente.statut !== "termine");
  const COL = { // couleur de la pastille par priorité
    red:   "background:#fdecea;color:#c0564b",
    orange:"background:#fbe6d6;color:#b87316",
    yellow:"background:#f8f2d6;color:#977f14",
    green: "background:#e7f4ec;color:#2f8f5b",
    grey:  "background:#ececec;color:#8a8a8a",
  };
  const rows = suivies.map(c => {
    const cl = c.cliente;
    const bilans = (c.bilans||[]).slice().sort((a,b)=> a.date<b.date?1:-1);
    const dernier = bilans[0] || null;
    const b = Calc.bilanStats(c.bilans, c.accompagnement && c.accompagnement.date_debut);
    const demarree = !!(c.accompagnement && c.accompagnement.date_debut);
    const aRempli = bilans.length > 0;
    // Une cliente démarrée SANS bilan saisi n'est PAS « jamais rempli » : son bilan
    // initial a été fait au démarrage (hors appli). On la traite comme les autres, le
    // prochain bilan tombant à date_debut + 28 j (calculé dans bilanStats).
    let prio, chip, col;
    if (!demarree){ prio=4; chip="Pas encore démarré"; col=COL.grey; }
    else if (b.joursAvant!==null && b.joursAvant<0){ prio=1; chip=`🟠 En retard de ${Math.abs(b.joursAvant)} j`; col=COL.orange; }
    else if (b.joursAvant!==null && b.joursAvant<=7){ prio=2; chip=`🟡 Prochain dans ${b.joursAvant} j`; col=COL.yellow; }
    else { prio=3; chip="✅ À jour"; col=COL.green; }
    return { cl, bilans, dernier, b, prio, chip, col, aRempli, demarree };
  });

  // Ligne d'une cliente (réutilisée dans les deux blocs).
  const rowHtml = (r) => {
    const cl = r.cl;
    let detail, prochain = "";
    if (!r.aRempli){
      if (!r.demarree){ detail = `pas encore démarrée`; }
      else {
        // Bilan initial fait au démarrage → on affiche juste le prochain (démarrage + 4 sem.).
        detail = `bilan initial au démarrage`;
        prochain = r.b.prochain ? ` · prochain le ${Calc.fmt(r.b.prochain)}` : "";
      }
    } else {
      const d = r.dernier;
      const qui = d.saisi_par==="cliente" ? "rempli par elle" : "saisi par toi";
      const quand = d.created_at ? Calc.fmt(String(d.created_at).slice(0,10)) : Calc.fmt(d.date);
      detail = `dernier : <strong>${Calc.fmt(d.date)}</strong> · ${qui} le ${quand} · ${r.bilans.length} au total`;
      prochain = r.b.prochain ? ` · prochain le ${Calc.fmt(r.b.prochain)}` : "";
    }
    const wa = (r.prio<=2) ? Calc.waHref(cl.telephone, Calc.bilanMsg(cl, r.b.joursAvant!==null && r.b.joursAvant<0)) : null;
    return `<div class="cl-line" style="padding:7px 0;gap:8px;flex-wrap:wrap">
      <a href="cliente.html?id=${cl.id}" style="text-decoration:none;color:inherit;min-width:0;flex:1 1 55%">
        <strong>${esc(cl.prenom)} ${esc(cl.nom||"")}</strong>
        <span style="display:block;font-size:.8rem;color:var(--text-light)">${detail}${prochain}</span>
      </a>
      <span style="display:flex;gap:6px;align-items:center;flex:none">
        <span class="dot-alert" style="${r.col}">${r.chip}</span>
        ${wa?`<a class="tag tag-wa" href="${wa}" target="_blank" rel="noopener" title="Demander le bilan sur WhatsApp">📲</a>`:""}
      </span>
    </div>`;
  };

  // On classe désormais par ÉCHÉANCE du prochain bilan (démarrage + 4 sem. si aucun
  // bilan saisi), plus par « jamais rempli ». Les démarrées qui n'ont pas encore de
  // bilan saisi ne sont donc plus en rouge : leur bilan initial a eu lieu au démarrage.
  // Bloc 1 : à faire — en retard ou dans les 7 jours (prio 1 ou 2), plus urgent d'abord.
  const aFaire = rows.filter(r=>r.demarree && r.prio<=2)
    .sort((a,b)=> a.prio-b.prio || ((a.b.joursAvant??0)-(b.b.joursAvant??0)));
  // Bloc 2 : à jour (prio 3), bilan le plus récent d'abord.
  const aJour = rows.filter(r=>r.demarree && r.prio===3)
    .sort((a,b)=> (a.dernier?a.dernier.date:"")<(b.dernier?b.dernier.date:"")?1:-1);
  // Bloc 3 : pas encore démarrées (gris, tout en bas).
  const pasDemarree = rows.filter(r=>!r.demarree).sort((a,b)=>(a.cl.prenom||"").localeCompare(b.cl.prenom||""));

  const sub = (titre, arr, couleur) => arr.length
    ? `<div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:${couleur};margin:10px 2px 2px">${titre} (${arr.length})</div>`
      + `<div class="card" style="margin-top:4px;padding:6px 12px">${arr.map(rowHtml).join("")}</div>`
    : "";

  box.innerHTML = `<details class="section-block" style="margin:14px 0">
    <summary><span class="chev">▸</span>📋 Suivi des bilans<span class="count">${rows.length}</span>${aFaire.length?`<span class="count" style="background:#b87316;color:#fff">🔔 ${aFaire.length}</span>`:""}</summary>
    <div class="section-body">
      ${sub("🔔 Bilan à faire (retard ou ≤ 7 j)", aFaire, "#b87316")}
      ${sub("✅ À jour", aJour, "#2f8f5b")}
      ${sub("· Pas encore démarrées", pasDemarree, "#8a8a8a")}
      ${!rows.length?`<p class="empty">Aucune cliente à suivre.</p>`:""}
    </div></details>`;
}

// ---- Suivi des bilans de démarrage (ressenti des premières séances) ----
function renderBilansDemarrage(){
  const box = document.getElementById("bilansDemarrage");
  const suivies = STATE.clientes.filter(c => c.cliente.statut !== "termine" && c.accompagnement && c.accompagnement.date_debut);
  const aFaire = [], faits = [];
  suivies.forEach(c => {
    const done = (c.bilansDemarrage||[]).length > 0;
    if (done){
      const d = [...c.bilansDemarrage].sort((a,b)=>a.date<b.date?1:-1)[0];
      faits.push({ cl:c.cliente, date:d.date });
    } else if (Calc.bilanDemarrageDue(c.accompagnement, c.seances, c.bilansDemarrage)){
      const st = Calc.seancesStats(c.accompagnement, c.seances);
      aFaire.push({ cl:c.cliente, realisees:st.realisees });
    }
  });
  if (!aFaire.length && !faits.length){ box.innerHTML = ""; return; }
  const rowA = r => {
    const wa = Calc.waHref(r.cl.telephone, Calc.bilanDemarrageMsg(r.cl));
    return `<div class="cl-line" style="padding:7px 0;gap:8px;flex-wrap:wrap">
      <a href="cliente.html?id=${r.cl.id}" style="text-decoration:none;color:inherit;flex:1 1 55%"><strong>${esc(r.cl.prenom)} ${esc(r.cl.nom||"")}</strong>
      <span style="display:block;font-size:.8rem;color:var(--text-light)">${r.realisees} séances faites — ressenti pas encore demandé</span></a>
      <span style="display:flex;gap:6px;align-items:center;flex:none"><span class="dot-alert" style="background:#fbe6d6;color:#b87316">🩹 À demander</span>${wa?`<a class="tag tag-wa" href="${wa}" target="_blank" rel="noopener" title="Demander le ressenti sur WhatsApp">📲</a>`:""}</span>
    </div>`;
  };
  const rowF = r => `<div class="cl-line" style="padding:7px 0;gap:8px;flex-wrap:wrap">
      <a href="cliente.html?id=${r.cl.id}" style="text-decoration:none;color:inherit;flex:1 1 55%"><strong>${esc(r.cl.prenom)} ${esc(r.cl.nom||"")}</strong>
      <span style="display:block;font-size:.8rem;color:var(--text-light)">fait le ${Calc.fmt(r.date)}</span></a>
      <span class="dot-alert" style="background:#e7f4ec;color:#2f8f5b;flex:none">✅ Fait</span></div>`;
  const sub = (t,arr,col,fn) => arr.length
    ? `<div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:${col};margin:10px 2px 2px">${t} (${arr.length})</div><div class="card" style="margin-top:4px;padding:6px 12px">${arr.map(fn).join("")}</div>`
    : "";
  box.innerHTML = `<details class="section-block" style="margin:14px 0">
    <summary><span class="chev">▸</span>🩹 Bilans de démarrage<span class="count">${aFaire.length+faits.length}</span>${aFaire.length?`<span class="count" style="background:#b87316;color:#fff">🩹 ${aFaire.length}</span>`:""}</summary>
    <div class="section-body">
      ${sub("🩹 Ressenti à demander", aFaire, "#b87316", rowA)}
      ${sub("✅ Déjà fait", faits, "#2f8f5b", rowF)}
    </div></details>`;
}

// ---- Clientes actives sans aucune séance à venir (trou dans le planning) ----
function renderSansSeance(){
  const box = document.getElementById("sansSeance");
  const today = Calc.today();
  const sans = STATE.clientes.filter(c => {
    if (c.cliente.statut !== "active") return false;
    // Les distancielles n'ont pas de séances programmées en personne → normal, on les ignore ici.
    if (c.cliente.type === "distanciel") return false;
    return !(c.seances||[]).some(s => s.statut==="prevue" && s.date && s.date>=today);
  }).sort((a,b)=>(a.cliente.prenom||"").localeCompare(b.cliente.prenom||""));
  if (!sans.length){ box.innerHTML = ""; return; }
  box.innerHTML = `<details class="section-block" style="margin:14px 0">
    <summary><span class="chev">▸</span>🗓️ Sans séance programmée<span class="count" style="background:#b87316;color:#fff">${sans.length}</span></summary>
    <div class="section-body"><div class="card" style="margin-top:8px;padding:6px 12px">
    ${sans.map(c=>`<div class="cl-line" style="padding:7px 0;gap:8px;flex-wrap:wrap">
      <a href="cliente.html?id=${c.cliente.id}" style="text-decoration:none;color:inherit;flex:1 1 60%"><strong>${esc(c.cliente.prenom)} ${esc(c.cliente.nom||"")}</strong>
      <span style="display:block;font-size:.8rem;color:var(--text-light)">aucune séance à venir</span></a>
      <a class="tag" href="cliente.html?id=${c.cliente.id}" style="flex:none">➕ Programmer</a></div>`).join("")}
    </div></div></details>`;
}

// ---- Chargement groupé (peu de requêtes, quel que soit le nb de clientes) ----
async function loadAll() {
  const [clientes, accomp, seances, bilans, bilansDem, programmes, mensu] = await Promise.all([
    sb.from("clientes").select("*").order("created_at",{ascending:false}),
    sb.from("accompagnements").select("cliente_id,seances_prevues,seances_faites_init,date_debut,date_fin,nutrition_active,nb_mois"),
    sb.from("seances").select("id,cliente_id,statut,date,type,heure"),
    sb.from("bilans").select("cliente_id,date,saisi_par,created_at"),
    sb.from("bilans_demarrage").select("cliente_id,date"),
    sb.from("programmes").select("cliente_id,kind,envoye,date_envoi,date_fin,created_at"),
    sb.from("mensurations").select("cliente_id,type"),
  ]);
  const group = (rows, key="cliente_id") => {
    const m = {}; (rows.data||[]).forEach(r => { (m[r[key]] ||= []).push(r); }); return m;
  };
  const accMap = {}; (accomp.data||[]).forEach(a => accMap[a.cliente_id] = a);
  const seaMap = group(seances.data ? seances : {data:[]});
  const bilMap = group(bilans.data ? bilans : {data:[]});
  const bilDemMap = group(bilansDem.data ? bilansDem : {data:[]});
  const proMap = group(programmes.data ? programmes : {data:[]});
  // Types de mensurations par cliente → sert au repère « cou manquant pour l'IMG ».
  const mensTypes = {}; (mensu.data||[]).forEach(m => { (mensTypes[m.cliente_id] ||= new Set()).add(m.type); });

  STATE.clientes = (clientes.data||[]).map(cl => {
    const t = mensTypes[cl.id] || new Set();
    // IMG (masse grasse) possible seulement si taille+hanches+cou + taille au profil.
    const aTailleHanches = t.has("tour_taille") && t.has("tour_hanches") && !t.has("masse_grasse");
    // On signale quand tout est là SAUF le cou (et pas encore d'IMG) → un cou suffirait.
    const imgCouManquant = aTailleHanches && !!cl.taille_cm && !t.has("tour_cou");
    // Ou quand c'est la taille (profil) qui manque → l'IMG est bloqué à la racine.
    const imgTailleManquante = aTailleHanches && !cl.taille_cm;
    return {
      cliente: cl,
      accompagnement: accMap[cl.id] || null,
      seances: (seaMap[cl.id]||[]).map(s=>({id:s.id, statut:s.statut, date:s.date, type:s.type, heure:s.heure})),
      bilans: bilMap[cl.id]||[],
      bilansDemarrage: bilDemMap[cl.id]||[],
      programmes: proMap[cl.id]||[],
      imgCouManquant,
      imgTailleManquante,
    };
  });
}

// ---- Alertes globales ----
function renderAlerts() {
  const box = document.getElementById("alerts");
  const all = [];
  STATE.clientes.forEach(c => Calc.alertes(c).forEach(a => all.push({ ...a, c })));
  if (!all.length) { box.innerHTML = ""; return; }
  const order = { nouveau_bilan:0, bilan:1, bilan_demarrage:2, programme:3, nutrition_mensuelle:3, fin:4, prevoir_seances:5, seances:6, renouveler:7 };
  all.sort((a,b)=>(order[a.type]??9)-(order[b.type]??9));
  // Rendu d'UNE alerte (lien vers la fiche ou action WhatsApp selon le type).
  const alertHtml = (a) => {
    const cl = a.c.cliente;
    // Rappel de bilan → cliquer envoie la demande à la cliente sur WhatsApp.
    if (a.type === "bilan") {
      const b = Calc.bilanStats(a.c.bilans, a.c.accompagnement && a.c.accompagnement.date_debut);
      const retard = b.joursAvant !== null && b.joursAvant < 0;
      const wa = Calc.waHref(cl.telephone, Calc.bilanMsg(cl, retard));
      if (wa) {
        return `<a class="alert alert-action" href="${wa}" target="_blank" rel="noopener">
           <span>${a.icon}</span><span><strong>${a.label}</strong> · <span class="who">${esc(cl.prenom)}</span></span>
           <span class="alert-cta">Demander le bilan 📲</span></a>`;
      }
      // Pas de numéro enregistré → renvoie vers la fiche pour l'ajouter.
      return `<a class="alert" href="cliente.html?id=${cl.id}" title="Ajoute son numéro de téléphone dans sa fiche pour demander le bilan en un clic">
           <span>${a.icon}</span><span><strong>${a.label}</strong> · <span class="who">${esc(cl.prenom)}</span></span>
           <span class="alert-cta muted">☎️ n° manquant</span></a>`;
    }
    // Bilan de démarrage → cliquer envoie la demande à la cliente sur WhatsApp.
    if (a.type === "bilan_demarrage") {
      const wa = Calc.waHref(cl.telephone, Calc.bilanDemarrageMsg(cl));
      if (wa) {
        return `<a class="alert alert-action" href="${wa}" target="_blank" rel="noopener">
           <span>${a.icon}</span><span><strong>${a.label}</strong> · <span class="who">${esc(cl.prenom)}</span></span>
           <span class="alert-cta">Demander 📲</span></a>`;
      }
      return `<a class="alert" href="cliente.html?id=${cl.id}" title="Ajoute son numéro de téléphone dans sa fiche pour demander en un clic">
           <span>${a.icon}</span><span><strong>${a.label}</strong> · <span class="who">${esc(cl.prenom)}</span></span>
           <span class="alert-cta muted">☎️ n° manquant</span></a>`;
    }
    // Nouveau bilan rempli par la cliente → mis en avant avec la DATE, reste visible ~10 j.
    if (a.type === "nouveau_bilan") {
      const quand = a.date ? Calc.fmt(a.date) : "";
      return `<a class="alert alert-action" href="cliente.html?id=${cl.id}" style="border-left:4px solid var(--ok)">
         <span>${a.icon}</span><span><strong>${a.label}</strong> · <span class="who">${esc(cl.prenom)}</span>${quand?` · <span style="color:var(--text-light)">le ${quand}</span>`:""}</span>
         <span class="alert-cta">Voir 👀</span></a>`;
    }
    return `<a class="alert" href="cliente.html?id=${cl.id}">
       <span>${a.icon}</span><span><strong>${a.label}</strong> · <span class="who">${esc(cl.prenom)}</span></span>
     </a>`;
  };
  // Les « 🆕 Nouveau bilan rempli » (par une cliente) restent TOUJOURS VISIBLES en haut —
  // c'est une notif importante, on ne la cache pas dans le bandeau repliable.
  const nouveaux = all.filter(a => a.type === "nouveau_bilan");
  const reste    = all.filter(a => a.type !== "nouveau_bilan").slice(0, 8);
  const nouveauxHtml = nouveaux.length
    ? `<div style="display:flex;flex-direction:column;gap:8px;margin:14px 0">${nouveaux.map(alertHtml).join("")}</div>`
    : "";
  // Le reste, regroupé dans un bandeau REPLIABLE (fermé) pour éviter le scroll forcé.
  const resteHtml = reste.length
    ? `<details class="section-block" style="margin:14px 0">
        <summary><span class="chev">▸</span>🔔 À traiter<span class="count" style="background:var(--accent);color:#fff">${reste.length}</span></summary>
        <div class="section-body" style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${reste.map(alertHtml).join("")}</div>
      </details>`
    : "";
  box.innerHTML = nouveauxHtml + resteHtml;
}

// ---- Filtres ----
function renderFilters() {
  document.getElementById("filters").innerHTML = FILTERS.map(f =>
    `<button class="chip ${STATE.filter===f.key?'on':''}" data-k="${f.key}">${f.label}</button>`).join("");
  document.querySelectorAll("#filters .chip").forEach(ch => ch.onclick = () => {
    STATE.filter = STATE.filter === ch.dataset.k ? null : ch.dataset.k;
    renderFilters(); renderList();
  });
}

// ---- Liste des clientes ----
function renderList() {
  const cont = document.getElementById("content");
  let list = STATE.clientes;
  if (STATE.q) {
    const q = STATE.q.toLowerCase();
    list = list.filter(c => {
      const cl = c.cliente;
      return [cl.prenom,cl.nom,cl.objectif_principal,Calc.labelType(cl.type),Calc.labelStatut(cl.statut)]
        .filter(Boolean).some(v => v.toLowerCase().includes(q));
    });
  }
  if (STATE.filter) {
    const f = FILTERS.find(x=>x.key===STATE.filter);
    list = list.filter(f.test);
  }
  // Tri (P3) — par défaut : ordre de chargement (plus récentes). On copie avant de trier
  // pour ne pas réordonner STATE.clientes lui-même.
  if (STATE.sort) {
    const jbilan = c => { const j = Calc.bilanStats(c.bilans, c.accompagnement && c.accompagnement.date_debut).joursAvant; return j==null ? 99999 : j; };
    const jfin   = c => { const j = Calc.suiviStats(c.accompagnement).joursRestants; return j==null ? 99999 : j; };
    const rest   = c => Calc.seancesStats(c.accompagnement, c.seances).restantes;
    const cmp = {
      nom:       (a,b)=> (a.cliente.prenom||"").localeCompare(b.cliente.prenom||""),
      bilan:     (a,b)=> jbilan(a)-jbilan(b),
      fin:       (a,b)=> jfin(a)-jfin(b),
      restantes: (a,b)=> rest(b)-rest(a),
    }[STATE.sort];
    if (cmp) list = [...list].sort(cmp);
  }
  // Raccourci global : total des séances restantes sur l'ensemble des clientes affichées.
  const totRestantes = list.reduce((n,c)=> n + Calc.seancesStats(c.accompagnement, c.seances).restantes, 0);
  document.getElementById("sub").textContent =
    `${STATE.clientes.length} cliente${STATE.clientes.length>1?'s':''}` +
    (list.length !== STATE.clientes.length ? ` · ${list.length} affichée${list.length>1?'s':''}` : "") +
    (totRestantes ? ` · ⏳ ${totRestantes} séance${totRestantes>1?'s':''} restante${totRestantes>1?'s':''} au total` : "");

  if (!list.length) {
    cont.innerHTML = `<div class="card"><p class="empty">Aucune cliente ne correspond.</p></div>`;
    return;
  }
  cont.innerHTML = `<div class="clientes-grid">` + list.map(c => {
    const cl = c.cliente;
    const s = Calc.seancesStats(c.accompagnement, c.seances);
    const b = Calc.bilanStats(c.bilans, c.accompagnement && c.accompagnement.date_debut);
    const al = Calc.alertes(c);
    const _today = Calc.today();
    const upcoming = (c.seances||[]).filter(x=>x.statut==="prevue" && x.date && x.date>=_today).sort((a,b)=>a.date<b.date?-1:1);
    return `<a class="cl-card" href="cliente.html?id=${cl.id}">
      <div class="cl-top">
        <div style="display:flex;gap:11px;align-items:center;min-width:0">
          <div class="cl-avatar">${initials(cl)}</div>
          <div style="min-width:0">
            <div class="cl-name">${cl.prenom||''} ${cl.nom||''}</div>
            <div class="cl-obj">${cl.objectif_principal||'—'}</div>
          </div>
        </div>
      </div>
      <div class="cl-meta">
        <span class="badge badge-type">${Calc.labelType(cl.type)}</span>
        <span class="st st-${cl.statut}">${Calc.labelStatut(cl.statut)}</span>
      </div>
      ${s.prevues ? UI.progressBar(s.pct, `${s.realisees} / ${s.prevues} séances`) : ''}
      ${s.prevues ? `<div class="cl-line"><span>Séances</span><strong>${s.realisees}/${s.prevues} faites · <span style="color:var(--accent)">${s.restantes} restantes</span></strong></div>` : ''}
      <div class="cl-line"><span>📅 Séances à venir</span><strong style="text-transform:capitalize">${upcoming.length ? `${upcoming.length} · ${Calc.fmtJour(upcoming[0].date)}${Calc.fmtHeure(upcoming[0].heure)?` à ${Calc.fmtHeure(upcoming[0].heure)}`:''}` : '—'}</strong></div>
      <div class="cl-line"><span>Dernier bilan</span><strong>${Calc.fmt(b.dernier)}</strong></div>
      <div class="cl-line"><span>Prochain bilan</span><strong>${Calc.fmt(b.prochain)}</strong></div>
      ${(() => {
        // Fin estimée : présentiel = au rythme des séances ; sinon date de fin prévue.
        const fin = cl.type==="presentiel" ? Calc.finEstimeeSeances(c.accompagnement, c.seances) : (c.accompagnement && c.accompagnement.date_fin);
        return fin ? `<div class="cl-line"><span>🏁 Fin ${cl.type==="presentiel"?"estimée":"(prév.)"}</span><strong>${Calc.fmt(fin)}</strong></div>` : '';
      })()}
      <div class="cl-line"><span>📲 Espace</span><strong style="text-align:right;text-transform:capitalize">${cl.derniere_connexion ? `vu ${Calc.fmtDateHeure(cl.derniere_connexion)}` : 'jamais connectée'}</strong></div>
      ${al.length ? `<div class="cl-alerts">${al.map(a=>{
        // Pastille « bilan » cliquable → WhatsApp (data-wa géré par délégation, cf. init).
        if (a.type === "bilan") {
          const wa = Calc.waHref(cl.telephone, Calc.bilanMsg(cl, b.joursAvant !== null && b.joursAvant < 0));
          if (wa) return `<span class="dot-alert dot-wa" data-wa="${wa}" title="Demander le bilan sur WhatsApp">${a.icon} ${a.label} 📲</span>`;
        }
        if (a.type === "bilan_demarrage") {
          const wa = Calc.waHref(cl.telephone, Calc.bilanDemarrageMsg(cl));
          if (wa) return `<span class="dot-alert dot-wa" data-wa="${wa}" title="Demander le bilan de démarrage sur WhatsApp">${a.icon} ${a.label} 📲</span>`;
        }
        return `<span class="dot-alert">${a.icon} ${a.label}</span>`;
      }).join('')}</div>` : ''}
      ${(c.imgCouManquant||c.imgTailleManquante) ? `<div class="cl-alerts">${c.imgCouManquant?`<span class="dot-alert" style="background:#f8f2d6;color:#977f14" title="Ajoute son tour de cou (même date) pour calculer sa masse grasse">📏 IMG : cou manquant</span>`:''}${c.imgTailleManquante?`<span class="dot-alert" style="background:#f8f2d6;color:#977f14" title="Renseigne sa taille (cm) dans sa fiche pour débloquer le calcul de masse grasse">📏 IMG : taille manquante</span>`:''}</div>` : ''}
    </a>`;
  }).join("") + `</div>`;
}

// ---- Nouvelle cliente ----
function makeCode(prenom){
  const base = (prenom||"CLI").normalize("NFD").replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,6) || "CLI";
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sans I,O,0,1
  let s = ""; for (let i=0;i<5;i++) s += A[Math.floor(Math.random()*A.length)];
  return base + "-" + s;
}
document.getElementById("newCliente").onclick = async () => {
  const v = await UI.form({
    title: "Nouvelle cliente",
    submit: "Créer la fiche",
    fields: [
      { name:"prenom", label:"Prénom", required:true, half:true },
      { name:"nom", label:"Nom", half:true },
      { name:"type", label:"Accompagnement", type:"select", half:true, value:"presentiel", options:[
        {value:"presentiel",label:"Présentiel"},{value:"distanciel",label:"Distanciel"},{value:"hybride",label:"Hybride"}]},
      { name:"statut", label:"Statut", type:"select", half:true, value:"a_demarrer", options:[
        {value:"a_demarrer",label:"À démarrer"},{value:"active",label:"Active"},{value:"en_pause",label:"En pause"},
        {value:"termine",label:"Terminé"},{value:"a_renouveler",label:"À renouveler"}]},
      { name:"objectif_principal", label:"Objectif principal", placeholder:"Perte de poids, prise de masse…" },
      { name:"date_debut", label:"Date de début", type:"date", half:true, value:Calc.today() },
      { name:"seances_prevues", label:"Séances prévues", type:"number", half:true, placeholder:"12" },
      { name:"nb_mois", label:"Durée (mois)", type:"number", half:true, placeholder:"3" },
      { name:"nutrition_active", label:"Suivi nutrition", type:"checkbox", half:true },
    ],
  });
  if (!v) return;
  try {
    const cliente = await DB.createCliente({
      prenom:v.prenom, nom:v.nom, type:v.type, statut:v.statut,
      objectif_principal:v.objectif_principal, access_code: makeCode(v.prenom),
    });
    // date de fin auto si début + mois
    let date_fin = null;
    if (v.date_debut && v.nb_mois) {
      const d = Calc.parse(v.date_debut); d.setMonth(d.getMonth()+Number(v.nb_mois));
      date_fin = Calc.ymd(d);
    }
    await DB.saveAccompagnement(cliente.id, {
      date_debut:v.date_debut, date_fin, nb_mois:v.nb_mois,
      seances_prevues:v.seances_prevues||0, nutrition_active:!!v.nutrition_active,
    });
    UI.toast("Cliente créée ✓");
    location.href = "cliente.html?id=" + cliente.id;
  } catch(e){ console.error(e); UI.toast("Erreur : "+(e.message||e), "err"); }
};

// ---- Init ----
(async () => {
  const p = await Auth.requireCoach();
  if (!p) return;
  document.getElementById("who").textContent = (p.prenom||"Coach");
  document.getElementById("logout").onclick = () => Auth.signOut();
  document.getElementById("q").addEventListener("input", e => { STATE.q = e.target.value.trim(); renderList(); });
  document.getElementById("sort").addEventListener("change", e => { STATE.sort = e.target.value; renderList(); });
  // Clic sur une pastille de bilan dans une carte → WhatsApp (sans naviguer vers la fiche).
  document.getElementById("content").addEventListener("click", (e) => {
    const w = e.target.closest(".dot-wa");
    if (w && w.dataset.wa) { e.preventDefault(); e.stopPropagation(); window.open(w.dataset.wa, "_blank"); }
  });
  // Bouton « ✅ Fait » dans l'agenda → passe la séance en réalisée + rafraîchit.
  document.getElementById("agenda").addEventListener("click", async (e) => {
    // Bascule de vue « À venir » / « Semaine ».
    const viewBtn = e.target.closest("[data-view]");
    if (viewBtn){ e.preventDefault(); STATE.agendaView = viewBtn.dataset.view; renderAgenda(); return; }
    // Ajout à l'agenda Apple (.ics) — priorité sur le bouton « Fait ».
    const icsBtn = e.target.closest("[data-ics]");
    if (icsBtn){
      e.preventDefault();
      const c = STATE.clientes.find(x => String(x.cliente.id) === String(icsBtn.dataset.cl));
      const s = c && (c.seances||[]).find(x => String(x.id) === String(icsBtn.dataset.ics));
      if (c && s){ Calc.downloadSeanceICS(c.cliente, s); UI.toast("Séance ajoutée à ton agenda 📅"); }
      return;
    }
    const btn = e.target.closest("[data-done]"); if (!btn) return;
    e.preventDefault(); btn.disabled = true;
    // Mise à jour LOCALE immédiate (pas de rechargement complet) : on retrouve la séance
    // dans STATE, on la passe en "realisee", et on ne redessine que les blocs concernés.
    // Rapide et fluide même avec beaucoup de clientes. Rollback si l'écriture échoue.
    let target = null;
    for (const c of STATE.clientes){
      const s = (c.seances||[]).find(x => String(x.id) === String(btn.dataset.done));
      if (s){ target = s; break; }
    }
    const prev = target ? target.statut : null;
    if (target) target.statut = "realisee";
    renderAlerts(); renderAgenda(); renderBilansDemarrage(); renderSansSeance(); renderList();
    try {
      const { error } = await sb.from("seances").update({ statut:"realisee" }).eq("id", btn.dataset.done);
      if (error) throw error;
      UI.toast("Séance marquée faite ✓");
    } catch(err){
      console.error(err); UI.toast("Erreur : "+(err.message||err),"err");
      if (target) target.statut = prev; // rollback visuel
      renderAlerts(); renderAgenda(); renderBilansDemarrage(); renderSansSeance(); renderList();
    }
  });
  try {
    await loadAll();
    renderAlerts(); renderAgenda(); renderBilans(); renderBilansDemarrage(); renderSansSeance(); renderFilters(); renderList();
  } catch(e){
    console.error(e);
    document.getElementById("content").innerHTML =
      `<div class="card"><p class="empty">Erreur de chargement. Vérifie la config Supabase (js/config.js) et le SQL.</p></div>`;
  }
})();
</script>
